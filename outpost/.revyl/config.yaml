project:
    id: f1bc30cf-7733-43cb-818d-32dc1773578b
run_test_definitions_from_git: true
session:
    idle_timeout_seconds: 1800
build:
    framework: expo
    env:
        EXPO_PUBLIC_CONVEX_URL: https://patient-flamingo-104.convex.cloud
    caches:
        - key: npm
          paths:
            - ~/.npm
    profiles:
        pull-request:
            ios:
                app_id: db085c7f-c3e1-48dd-a52a-d8bf110e5236
                setup_commands:
                    - npm ci
                    - npx expo prebuild --platform ios --no-install
                build_commands:
                    - cd ios && pod install && WS=$(ls -d *.xcworkspace | head -n 1) && xcodebuild -workspace "$WS" -scheme "${WS%.xcworkspace}" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -derivedDataPath build
                output_path: ios/build/Build/Products/Release-iphonesimulator/*.app
                image: ios-macos-26-xcode-26.6
                env:
                    EXPO_PUBLIC_DEVICE_ID: revyl-proof-ios-fixed-device-for-pull-request-proofs
                    REVYL_USE_FINGERPRINT: "1"
                caches:
                    - key: cocoapods
                      paths:
                        - ~/Library/Caches/CocoaPods
pr_review:
    enabled: true
    triggers:
        paths:
            - outpost/**
            - "!outpost/convex/**"
            - "!outpost/studio/**"
            - "!outpost/docs/**"
            - "!outpost/**/*.md"
    build:
        kind: revyl
        profile: pull-request
    proof_of_changes:
        enabled: true
        harness:
            kind: revyl
        always_verify:
            - The app launches straight to the Base village (the pixel-art island under a wooden header, with the Feed, Base and You tab bar) without a sign-in screen or a crash.
        system_prompt: Outpost is iOS-only. The proof device is a fixed dry-run test user, so nothing it approves posts publicly. Its Feed may hold seeded "Revyl test clip" videos. Don't send a Feed card back with a reason unless the change is about remakes, because each one queues a render on the team's laptop studio.
    workflows:
        enabled: true
        workflow_ids:
            - b3b116b1-5b0c-4cd8-967a-8d2e0f01c16f
