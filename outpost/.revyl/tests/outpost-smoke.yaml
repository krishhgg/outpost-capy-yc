test:
    metadata:
        name: outpost-smoke
        platform: ios
        tags:
            - outpost-regression
    build:
        name: Outpost iOS
        build_selection: inherit
    blocks:
        - type: manual
          step_type: wait
          step_description: "5"
        - type: if
          condition: Is a "While you were away" card showing with a Collect button?
          then:
            - type: instructions
              step_description: Tap Collect and wait for the card to close.
        - type: validation
          step_description: No sign-in, sign-up or account connection screen is showing, and there is no error such as "Outpost is full right now".
        - type: instructions
          step_description: Tap the Base tab in the bottom tab bar.
        - type: validation
          step_description: The Base screen shows the pixel-art village under a wooden header with streak, views and coin counters, and a tab bar with Bounties, Feed, Base and You at the bottom.
        - type: instructions
          step_description: Tap the Hood button with the gear icon at the top right of the Base header.
        - type: validation
          step_description: The "UNDER THE HOOD" screen is showing with a Services list.
        - type: instructions
          step_description: Tap Done at the top right.
        - type: validation
          step_description: The Base village is showing again.
        - type: instructions
          step_description: Tap the Feed tab in the bottom tab bar.
        - type: manual
          step_type: wait
          step_description: "3"
        - type: validation
          step_description: The Feed shows either a full-screen video card with the estimated earnings and taste score over its top edge, or a designed empty state such as "ALL CAUGHT UP" or a message that the studio is offline. It is not blank and shows no error.
        - type: validation
          step_description: When a video card shows, a gold pill with a brand and a rate such as "$1.50/1K", or no pill for a non-bounty test clip, sits at its bottom left, and there are no REMAKE/POST buttons or edit chips under the video.
        - type: instructions
          step_description: Tap the You tab in the bottom tab bar.
        - type: validation
          step_description: The You screen shows a "YOU" header and a card with the day streak number and "DAY STREAK".
