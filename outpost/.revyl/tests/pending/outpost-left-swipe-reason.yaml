# PENDING until the Feed's reworked send-back flow (T8) merges. Runs read only files directly in .revyl/tests/, so this one is skipped.
# To turn it on, follow "Promote a pending test" in outpost/docs/testing.md.
test:
    metadata:
        name: outpost-left-swipe-reason
        platform: ios
        tags:
            - outpost-regression
    build:
        name: Outpost iOS
        build_selection: inherit
    blocks:
        - type: manual
          step_type: wait
          step_description: "5"
        - type: if
          condition: Is a "While you were away" card showing with a Collect button?
          then:
            - type: instructions
              step_description: Tap Collect and wait for the card to close.
        - type: instructions
          step_description: Tap the Feed tab in the bottom tab bar.
        - type: instructions
          step_description: Swipe the top video card to the left.
        - type: validation
          step_description: A sheet asks what the studio should change and lists reasons such as "Hook too slow".
        - type: instructions
          step_description: Tap "Hook too slow".
        - type: validation
          step_description: The sheet closes, the card is gone and the next card or the empty state shows.
