# PENDING until Feed edit chips with fast remakes (T8 + T6) merges. Runs read only files directly in .revyl/tests/, so this one is skipped.
# To turn it on, follow "Promote a pending test" in outpost/docs/testing.md.
test:
    metadata:
        name: outpost-edit-chip-remake
        platform: ios
        tags:
            - outpost-regression
    build:
        name: Outpost iOS
        build_selection: inherit
    blocks:
        - type: manual
          step_type: wait
          step_description: "5"
        - type: if
          condition: Is a "While you were away" card showing with a Collect button?
          then:
            - type: instructions
              step_description: Tap Collect and wait for the card to close.
        - type: instructions
          step_description: Tap the Feed tab in the bottom tab bar.
        - type: instructions
          step_description: Tap the "Punchier hook" edit chip on the top video card.
        - type: validation
          step_description: 'The app confirms the remake is on its way (for example "Remaking: punchier hook") and the next card shows.'
