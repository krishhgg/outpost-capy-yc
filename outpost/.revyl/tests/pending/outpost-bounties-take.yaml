# PENDING until the Bounties screen (T2 backend + its UI) merges. Runs read only files directly in .revyl/tests/, so this one is skipped.
# To turn it on, follow "Promote a pending test" in outpost/docs/testing.md.
test:
    metadata:
        name: outpost-bounties-take
        platform: ios
        tags:
            - outpost-regression
    build:
        name: Outpost iOS
        build_selection: inherit
    blocks:
        - type: manual
          step_type: wait
          step_description: "5"
        - type: if
          condition: Is a "While you were away" card showing with a Collect button?
          then:
            - type: instructions
              step_description: Tap Collect and wait for the card to close.
        - type: instructions
          step_description: Open the Bounties board.
        - type: validation
          step_description: The board lists bounties, each card showing a brand, a reward, spots or budget left, what Outpost will make, and a Take button.
        - type: instructions
          step_description: Tap Take on the first bounty that is not taken yet.
        - type: validation
          step_description: That card now shows it is taken, with background progress such as "Downloading footage", "Making 1 of 5" or queued, and the board is still usable.
